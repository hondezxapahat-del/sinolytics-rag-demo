<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sinolume — Ask</title>
<style>
  :root {
    --ink: #141414;
    --paper: #ffffff;
    --red: #a4161a;
    --grey: #8a8a8a;
    --line: #e6e2df;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: "Helvetica Neue", Arial, sans-serif;
  }

  .top {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 32px;
  }

  .brand {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  .brand span { color: var(--red); }

  .back {
    font-size: 12.5px;
    color: var(--grey);
    text-decoration: none;
    letter-spacing: 0.03em;
  }
  .back:hover { color: var(--ink); }

  .center {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .stage {
    width: 100%;
    max-width: 620px;
  }

  .greeting {
    text-align: center;
    font-size: clamp(24px, 3.4vw, 32px);
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 34px;
    color: #2a2a2a;
  }

  .greeting .accent {
    color: var(--red);
  }

  .ask-box {
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 6px 6px 6px 20px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
    background: #fff;
  }

  .ask-box:focus-within {
    border-color: var(--red);
    box-shadow: 0 0 0 3px rgba(164, 22, 26, 0.08);
  }

  textarea {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    font-family: inherit;
    font-size: 15.5px;
    line-height: 1.6;
    padding: 14px 0;
    min-height: 26px;
    max-height: 160px;
    color: var(--ink);
  }

  textarea::placeholder { color: #b0b0b0; }

  .send-btn {
    background: var(--red);
    border: none;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    margin-bottom: 4px;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .send-btn:hover { background: #841216; }
  .send-btn:disabled { background: #e6c9ca; cursor: default; }
  .send-btn svg { width: 17px; height: 17px; stroke: #fff; }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-top: 22px;
  }

  .chip {
    font-size: 13px;
    color: var(--grey);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 9px 16px;
    cursor: pointer;
    background: #fff;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .chip:hover { border-color: var(--red); color: var(--red); }

  /* answer state */
  .answer-wrap {
    display: none;
    margin-top: 30px;
    border-left: 3px solid var(--red);
    padding-left: 20px;
  }
  .answer-wrap.show { display: block; }

  .answer-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--red);
    font-weight: 700;
    margin-bottom: 8px;
  }

  .answer-text {
    font-size: 15.5px;
    line-height: 1.75;
    color: #2a2a2a;
  }

  .loading {
    display: none;
    align-items: center;
    gap: 8px;
    color: var(--grey);
    font-size: 13.5px;
    margin-top: 26px;
    padding-left: 3px;
  }
  .loading.show { display: flex; }

  .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--red);
    animation: pulse 1.1s infinite ease-in-out;
  }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }

  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>

<div class="top">
  <div class="brand">Sino<span>lume</span></div>
  <a class="back" href="landing_preview.html">← Back</a>
</div>

<div class="center">
  <div class="stage">
    <div class="greeting">What would you like to know about<br><span class="accent">China's policy landscape</span>?</div>

    <div class="ask-box">
      <textarea id="q" rows="1" placeholder="Ask about industrial policy, supply chains, regulation…"></textarea>
      <button class="send-btn" id="askBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </button>
    </div>

    <div class="suggestions">
      <div class="chip" data-q="Why are Chinese AI models so much cheaper?">Why are Chinese AI models cheaper?</div>
      <div class="chip" data-q="What are the key risks in China's battery supply chain?">Battery supply chain risks</div>
      <div class="chip" data-q="How is China regulating outbound data transfers?">Outbound data transfer rules</div>
    </div>

    <div class="loading" id="loading">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      <span>Thinking…</span>
    </div>

    <div class="answer-wrap" id="answerWrap">
      <div class="answer-label">Answer</div>
      <div class="answer-text" id="answerText"></div>
    </div>
  </div>
</div>

<script>
  const btn = document.getElementById('askBtn');
  const q = document.getElementById('q');
  const loading = document.getElementById('loading');
  const answerWrap = document.getElementById('answerWrap');
  const answerText = document.getElementById('answerText');

  const demoAnswer = "Chinese AI labs are pricing models far below cost — not because inference is cheaper, but because parent cloud platforms are subsidizing the price war to win developer mindshare and enterprise accounts. The model itself is a customer-acquisition tool, not the profit center.";

  function ask(question) {
    if (!question || !question.trim()) return;
    answerWrap.classList.remove('show');
    loading.classList.add('show');
    btn.disabled = true;

    setTimeout(() => {
      loading.classList.remove('show');
      answerText.textContent = demoAnswer;
      answerWrap.classList.add('show');
      btn.disabled = false;
    }, 1300);
  }

  btn.addEventListener('click', () => ask(q.value));

  q.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      ask(q.value);
    }
  });

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      q.value = chip.dataset.q;
      ask(q.value);
    });
  });

  // auto-grow textarea
  q.addEventListener('input', () => {
    q.style.height = 'auto';
    q.style.height = Math.min(q.scrollHeight, 160) + 'px';
  });
</script>

</body>
</html>
