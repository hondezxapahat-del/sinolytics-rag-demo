<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sinolytics — Chat</title>
<style>
  :root {
    --ink: #141414;
    --paper: #ffffff;
    --red: #a4161a;
    --grey: #8a8a8a;
    --line: #e6e2df;
    --web-bg: #fdf6f1;
    --web-accent: #b8641a;
    --rag-bg: #fdf1f1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--paper); color: var(--ink); font-family: "Helvetica Neue", Arial, sans-serif; }
  .layout { display: flex; height: 100vh; }
  .app { display: flex; flex-direction: column; height: 100vh; flex: 1; min-width: 0; }

  /* Conversation-history sidebar (PRD_v1.1.md Goal 5/8) */
  .sidebar { width: 260px; flex-shrink: 0; border-right: 1px solid var(--line); display: flex; flex-direction: column; height: 100vh; }
  .sidebar-top { padding: 18px 20px 14px 20px; }
  .sidebar-new-chat { margin: 0 16px 12px 16px; font-size: 13px; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; cursor: pointer; background: none; text-align: left; }
  .sidebar-new-chat:hover { border-color: var(--red); color: var(--red); }
  .thread-list { flex: 1; overflow-y: auto; padding: 0 10px; }
  .thread-item { display: flex; align-items: center; gap: 6px; padding: 9px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 2px; }
  .thread-item:hover { background: #f7f5f3; }
  .thread-item.active { background: var(--rag-bg); }
  .thread-item-title { flex: 1; font-size: 13px; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thread-item.active .thread-item-title { color: var(--red); font-weight: 600; }
  .thread-item-delete { flex-shrink: 0; font-size: 15px; color: var(--grey); background: none; border: none; cursor: pointer; padding: 2px 5px; border-radius: 4px; visibility: hidden; }
  .thread-item:hover .thread-item-delete { visibility: visible; }
  .thread-item-delete:hover { color: var(--red); background: #f0d6d6; }
  .thread-empty { font-size: 12.5px; color: var(--grey); padding: 8px 10px; }
  .sidebar-bottom { padding: 12px 16px 16px 16px; border-top: 1px solid var(--line); }
  .logout-btn { font-size: 12px; color: var(--grey); background: none; border: none; cursor: pointer; padding: 0; }
  .logout-btn:hover { color: var(--red); }

  .top { display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .brand { font-size: 13px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; text-decoration: none; color: var(--ink); cursor: pointer; }
  .brand span { color: var(--red); }
  .new-chat { font-size: 12px; color: var(--grey); border: 1px solid var(--line); border-radius: 20px; padding: 7px 14px; cursor: pointer; background: none; }
  .new-chat:hover { border-color: var(--red); color: var(--red); }

  .thread { flex: 1; overflow-y: auto; padding: 28px 0 20px 0; }
  .thread-inner { max-width: 680px; margin: 0 auto; padding: 0 24px; }

  /* Centered empty state — shown before the first message, like a homepage */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: calc(100vh - 220px);
    text-align: center;
    padding: 0 24px;
  }
  .empty-state.hidden { display: none; }

  .greeting {
    font-size: clamp(22px, 3vw, 28px);
    font-weight: 600;
    line-height: 1.35;
    color: #2a2a2a;
    margin-bottom: 26px;
    max-width: 520px;
  }
  .greeting .accent { color: var(--red); }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    max-width: 560px;
  }
  .chip {
    font-size: 13px;
    color: var(--grey);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 9px 16px;
    cursor: pointer;
    background: #fff;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .chip:hover { border-color: var(--red); color: var(--red); }

  .msg { margin-bottom: 26px; }
  .msg-user { display: flex; justify-content: flex-end; }
  .msg-user .bubble { background: var(--ink); color: #fff; padding: 11px 16px; border-radius: 14px 14px 2px 14px; max-width: 75%; font-size: 14.5px; line-height: 1.5; white-space: pre-wrap; }

  .msg-ai .label-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .source-tag { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 9px; border-radius: 4px; }
  .source-tag.web { background: var(--web-bg); color: var(--web-accent); border: 1px solid #eddccb; }
  .source-tag.rag { background: var(--rag-bg); color: var(--red); border: 1px solid #f0d6d6; }
  .source-tag.prediction { background: #f3f0fb; color: #5b3fa0; border: 1px solid #ded4f2; }

  .msg-ai .answer-block { border-left: 3px solid var(--line); padding-left: 16px; font-size: 14.5px; line-height: 1.7; color: #262626; }
  .msg-ai .answer-block p { margin-bottom: 10px; }
  .msg-ai .answer-block p:last-child { margin-bottom: 0; }
  .msg-ai .answer-block strong { color: var(--ink); font-weight: 700; }
  .msg-ai .answer-block .answer-list { margin: 4px 0 14px 0; padding-left: 20px; }
  .msg-ai .answer-block .answer-list li { margin-bottom: 6px; }
  .msg-ai .answer-block .answer-spacer { height: 4px; }
  .msg-ai .answer-block.web-border { border-left-color: var(--web-accent); }
  .msg-ai .answer-block.rag-border { border-left-color: var(--red); }
  .msg-ai .answer-block.prediction-border { border-left-color: #5b3fa0; }

  /* Human-confirmed prediction — visually distinct from a plain retrieved
     answer so a reader never mistakes one for the other (docs/TechSpec_v1.1.md §4.2). */
  .prediction-block { margin-top: 4px; padding: 14px 16px; border-radius: 10px; background: #f3f0fb; border-left: 3px solid #5b3fa0; }
  .prediction-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #5b3fa0; font-weight: 700; margin-bottom: 8px; }
  .prediction-body { font-size: 14.5px; line-height: 1.65; color: #2a2a2a; white-space: pre-wrap; }

  .prediction-pending-block { margin-top: 18px; padding: 14px 16px; border-radius: 10px; background: var(--rag-bg); border-left: 3px solid var(--red); }
  .prediction-pending-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--red); font-weight: 700; margin-bottom: 8px; }
  .prediction-pending-body { font-size: 14px; line-height: 1.65; color: #2a2a2a; }

  /* One block per Tavily result — content and source/date are rendered
     separately so a finding can never visually merge with the wrong source. */
  .web-findings { margin-top: 2px; }
  .web-finding { margin-bottom: 14px; }
  .web-finding:last-child { margin-bottom: 0; }
  .web-finding-content { font-size: 14.5px; line-height: 1.6; color: #262626; }
  .web-finding-meta { font-size: 11.5px; color: var(--grey); margin-top: 4px; }
  .web-finding-meta a { color: var(--web-accent); text-decoration: none; }
  .web-finding-meta a:hover { text-decoration: underline; }

  /* Visually separate block for internal-KB analysis surfaced alongside a
     web search — only rendered when the backend actually sent internal_analysis. */
  .internal-analysis-block { margin-top: 18px; padding: 14px 16px; border-radius: 10px; background: var(--rag-bg); border-left: 3px solid var(--red); }
  .internal-analysis-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--red); font-weight: 700; margin-bottom: 8px; }
  .internal-analysis-body { font-size: 14px; line-height: 1.65; color: #2a2a2a; }
  .internal-analysis-body p { margin-bottom: 8px; }
  .internal-analysis-body p:last-child { margin-bottom: 0; }
  .internal-analysis-body strong { color: var(--ink); }
  .internal-analysis-body .answer-list { margin: 4px 0 10px 0; padding-left: 18px; }
  .internal-analysis-body .answer-list li { margin-bottom: 4px; }

  /* Only rendered when the backend actually returns a non-empty expert_note —
     never fabricated client-side, never shown for unrelated/low-relevance retrieval */
  .expert-note { margin-top: 10px; font-size: 13.5px; line-height: 1.65; color: #4a4a4a; background: var(--rag-bg); border-radius: 8px; padding: 10px 14px; }
  .expert-note b { color: var(--red); }

  .chart-img { margin-top: 10px; max-width: 100%; border-radius: 8px; border: 1px solid var(--line); display: block; }

  .error-block { border-left: 3px solid #c0392b; padding-left: 16px; font-size: 14px; color: #c0392b; }

  .thinking { display: flex; align-items: center; gap: 8px; color: var(--grey); font-size: 13.5px; padding-left: 3px; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--red); animation: pulse 1.1s infinite ease-in-out; }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse { 0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); } 40% { opacity: 1; transform: scale(1); } }

  .composer { flex-shrink: 0; border-top: 1px solid var(--line); padding: 16px 24px 20px 24px; background: #fff; }
  .composer-inner { max-width: 680px; margin: 0 auto; }
  .ask-box { border: 1.5px solid var(--line); border-radius: 14px; padding: 6px 6px 6px 18px; display: flex; align-items: flex-end; gap: 10px; transition: border-color 0.15s ease, box-shadow 0.15s ease; }
  .ask-box:focus-within { border-color: var(--red); box-shadow: 0 0 0 3px rgba(164, 22, 26, 0.08); }
  textarea { flex: 1; border: none; outline: none; resize: none; font-family: inherit; font-size: 14.5px; line-height: 1.6; padding: 12px 0; min-height: 22px; max-height: 140px; color: var(--ink); }
  textarea::placeholder { color: #b0b0b0; }
  .send-btn { background: var(--red); border: none; width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; margin-bottom: 4px; }
  .send-btn:hover { background: #841216; }
  .send-btn:disabled { background: #e6c9ca; cursor: default; }
  .send-btn svg { width: 15px; height: 15px; stroke: #fff; }
  .hint { font-size: 11.5px; color: #b0b0b0; text-align: center; margin-top: 8px; }

  .lang-toggle { font-size: 12px; color: var(--grey); background: none; border: 1px solid var(--line); border-radius: 20px; padding: 7px 14px; cursor: pointer; }
  .lang-toggle:hover { border-color: var(--red); color: var(--red); }
</style>
</head>
<body>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-top">
      <a class="brand" href="index.html">Sino<span>lytics</span></a>
    </div>
    <button class="sidebar-new-chat" onclick="startNewChat()" data-i18n="ask_new_chat">+ New chat</button>
    <div class="thread-list" id="threadList"></div>
    <div class="sidebar-bottom">
      <button class="logout-btn" onclick="logout()" data-i18n="account_logout">Log out</button>
    </div>
  </div>

<div class="app">
  <div class="top">
    <a class="brand" href="index.html">Sino<span>lytics</span></a>
    <div style="display:flex; align-items:center; gap:10px;">
      <button class="lang-toggle" id="langToggle"></button>
      <button class="new-chat" onclick="startNewChat()" data-i18n="ask_new_chat">+ New chat</button>
    </div>
  </div>

  <div class="thread" id="thread">
    <div class="thread-inner" id="threadInner">
      <div class="empty-state" id="emptyState">
        <div class="greeting" data-i18n-html="ask_greeting_html">What would you like to know about<br><span class="accent">China's policy landscape</span>?</div>
        <div class="suggestions">
          <div class="chip" data-i18n="ask_chip1_label" data-i18n-q="ask_chip1_q" data-q="Why are Chinese AI models so much cheaper?">Why are Chinese AI models cheaper?</div>
          <div class="chip" data-i18n="ask_chip2_label" data-i18n-q="ask_chip2_q" data-q="What are the key risks in China's battery supply chain?">Battery supply chain risks</div>
          <div class="chip" data-i18n="ask_chip3_label" data-i18n-q="ask_chip3_q" data-q="How is China using export controls as a geopolitical tool?">China's export controls strategy</div>
          <div class="chip" data-i18n="ask_chip4_label" data-i18n-q="ask_chip4_q" data-q="Show me a chart of the EV price trend over the past year">Show EV price trend chart</div>
        </div>
      </div>
    </div>
  </div>

  <div class="composer">
    <div class="composer-inner">
      <div class="ask-box">
        <textarea id="q" rows="1" data-i18n-placeholder="ask_placeholder" placeholder="Ask a follow-up, or start a new topic…"></textarea>
        <button class="send-btn" id="sendBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </button>
      </div>
      <div class="hint" data-i18n="ask_hint">Answers may combine internal reports and live web results — sources are always labeled.</div>
    </div>
  </div>
</div>
</div>

<script src="i18n.js"></script>
<script>
  const API_BASE = "https://sinolytics-rag-demo-api.onrender.com";
  const API_URL = `${API_BASE}/ask`;

  // --- Auth (PRD_v1.1.md Goal 8) — lightweight username+password, just
  // enough to own a conversation history. No refresh-token flow: the token
  // is long-lived (30 days server-side, see auth.py) and re-login is the
  // only recovery if it expires or is revoked.
  const authToken = localStorage.getItem('access_token');
  if (!authToken) {
    window.location.href = 'login.html';
  }

  function logout() {
    localStorage.removeItem('access_token');
    window.location.href = 'login.html';
  }

  async function authFetch(path, options = {}) {
    const res = await fetch(`${API_BASE}${path}`, {
      ...options,
      headers: { ...(options.headers || {}), 'Authorization': `Bearer ${authToken}` },
    });
    if (res.status === 401) {
      logout();
      throw new Error(t('ask_session_expired'));
    }
    return res;
  }

  const threadInner = document.getElementById('threadInner');
  const thread = document.getElementById('thread');
  const emptyState = document.getElementById('emptyState');
  const q = document.getElementById('q');
  const sendBtn = document.getElementById('sendBtn');
  const threadList = document.getElementById('threadList');

  // Conversation identity now lives server-side (LangGraph checkpointer —
  // see docs/TechSpec_v1.1.md §4.5), so this file only needs to remember a
  // session_id, not the message history itself. Reading/writing it in the
  // URL (not just localStorage) means the URL itself is a bookmarkable,
  // copy-to-another-device link back into the same conversation — though
  // now that /ask checks ownership, only your own account can actually use it.
  let sessionId = new URLSearchParams(window.location.search).get('session_id');

  function startNewChat() {
    const url = new URL(window.location.href);
    url.searchParams.delete('session_id');
    window.location.href = url.toString();
  }

  // --- Sidebar: conversation list (PRD_v1.1.md Goal 5/8) ---

  async function loadThreadList() {
    try {
      const res = await authFetch('/conversations');
      if (!res.ok) throw new Error(`Server returned ${res.status}`);
      renderThreadList(await res.json());
    } catch (err) {
      threadList.innerHTML = `<div class="thread-empty">${t('ask_load_history_error')}</div>`;
    }
  }

  function renderThreadList(items) {
    if (items.length === 0) {
      threadList.innerHTML = `<div class="thread-empty">${t('ask_no_conversations')}</div>`;
      return;
    }
    threadList.innerHTML = '';
    items.forEach((item) => {
      const row = document.createElement('div');
      row.className = 'thread-item' + (item.session_id === sessionId ? ' active' : '');
      row.innerHTML = `
        <span class="thread-item-title"></span>
        <button class="thread-item-delete" title="Delete">×</button>
      `;
      const titleEl = row.querySelector('.thread-item-title');
      titleEl.textContent = item.title;
      titleEl.addEventListener('click', () => openThread(item.session_id));

      row.querySelector('.thread-item-delete').addEventListener('click', async (e) => {
        e.stopPropagation();
        if (!confirm(t('ask_delete_confirm').replace('{title}', item.title))) return;
        await authFetch(`/conversations/${item.session_id}`, { method: 'DELETE' });
        if (item.session_id === sessionId) {
          startNewChat();
          return;
        }
        loadThreadList();
      });

      threadList.appendChild(row);
    });
  }

  // Fetches and renders one thread's history. Only ever shows plain Q&A
  // text (renderHistoricalAiMessage) — the rich per-turn metadata (sources,
  // web findings, chart images, prediction labels) was never part of the
  // persisted checkpoint state, so a reloaded thread can't reproduce it.
  // This is a known, accepted limitation (docs/TechSpec_v1.1.md §4.5), not a bug.
  async function loadHistoryIntoView(id) {
    threadInner.innerHTML = '';
    emptyState.classList.add('hidden');
    try {
      const res = await authFetch(`/conversations/${id}/messages`);
      if (!res.ok) throw new Error(`Server returned ${res.status}`);
      const messages = await res.json();
      if (messages.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      messages.forEach((m) => {
        if (m.role === 'user') {
          renderUserMessage(m.content);
        } else {
          renderHistoricalAiMessage(m.content);
        }
      });
    } catch (err) {
      renderError(`${t('ask_conversation_load_error_prefix')} ${err.message}`);
    }
  }

  async function openThread(id) {
    if (id === sessionId) return;
    sessionId = id;
    const url = new URL(window.location.href);
    url.searchParams.set('session_id', sessionId);
    history.replaceState(null, '', url);
    await loadHistoryIntoView(id);
    loadThreadList();
  }

  // Lightweight markdown -> HTML for consulting-style formatting.
  // Handles: **bold**, bullet lines starting with - or •, and simple line breaks.
  // Not a full markdown parser — just enough for structured LLM output.
  function renderMarkdown(text) {
    if (!text) return '';

    const lines = text.split('\n');
    let html = '';
    let inList = false;

    for (let raw of lines) {
      const line = raw.trim();

      if (line.startsWith('- ') || line.startsWith('• ')) {
        if (!inList) { html += '<ul class="answer-list">'; inList = true; }
        html += `<li>${inlineFormat(line.slice(2))}</li>`;
        continue;
      }

      if (inList) { html += '</ul>'; inList = false; }

      if (line.length === 0) {
        html += '<div class="answer-spacer"></div>';
      } else {
        html += `<p>${inlineFormat(line)}</p>`;
      }
    }
    if (inList) html += '</ul>';
    return html;
  }

  function inlineFormat(str) {
    // Escape basic HTML first to avoid injection, then apply bold.
    const escaped = str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
    return escaped.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  }

  function scrollToBottom() {
    thread.scrollTop = thread.scrollHeight;
  }

  function renderUserMessage(text) {
    emptyState.classList.add('hidden');
    const div = document.createElement('div');
    div.className = 'msg msg-user';
    div.innerHTML = `<div class="bubble"></div>`;
    div.querySelector('.bubble').textContent = text;
    threadInner.appendChild(div);
    scrollToBottom();
  }

  let thinkingInterval = null;

  function renderThinking() {
    const div = document.createElement('div');
    div.className = 'msg msg-ai';
    div.id = 'thinkingMsg';
    div.innerHTML = `
      <div class="thinking">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <span id="thinkingText"></span>
      </div>`;
    div.querySelector('#thinkingText').textContent = t('ask_thinking_1');
    threadInner.appendChild(div);
    scrollToBottom();

    // Cycles through plausible status phrases purely for perceived responsiveness —
    // this does NOT reflect real backend progress unless wired to actual streaming.
    const phrases = [
      t('ask_thinking_1'),
      t('ask_thinking_2'),
      t('ask_thinking_3'),
      t('ask_thinking_4'),
    ];
    let i = 0;
    thinkingInterval = setInterval(() => {
      i = (i + 1) % phrases.length;
      const el = document.getElementById('thinkingText');
      if (el) el.textContent = phrases[i];
    }, 1800);
  }

  function removeThinking() {
    if (thinkingInterval) { clearInterval(thinkingInterval); thinkingInterval = null; }
    const el = document.getElementById('thinkingMsg');
    if (el) el.remove();
  }

  // Renders one AI turn. Every piece here is conditional on what the
  // backend actually sent — nothing is fabricated client-side:
  // - source_type controls the tag + accent color
  // - web_findings, when present, is rendered as one block per source
  //   (content + source name/date/link) instead of free-text prose, so a
  //   point can never visually detach from its own citation
  // - internal_analysis is its own separate block, only rendered when the
  //   backend judged the internal knowledge base genuinely relevant —
  //   never shown just because a web search happened to run
  // - expert_note (the plain-internal-search path) only renders if the
  //   backend included a non-empty string
  // - chart_image only renders if present
  function renderAiMessage(data) {
    const div = document.createElement('div');
    div.className = 'msg msg-ai';

    const isWeb = data.source_type === 'web';
    const isPrediction = data.source_type === 'prediction';
    const tagClass = isWeb ? 'web' : (isPrediction ? 'prediction' : 'rag');
    const tagText = isWeb ? t('ask_tag_web') : (isPrediction ? t('ask_tag_prediction') : t('ask_tag_internal'));
    const borderClass = isWeb ? 'web-border' : (isPrediction ? 'prediction-border' : 'rag-border');

    let html = `
      <div class="label-row"><span class="source-tag ${tagClass}">${tagText}</span></div>
      <div class="answer-block ${borderClass}"></div>
    `;
    div.innerHTML = html;

    const answerBlock = div.querySelector('.answer-block');

    if (isWeb && data.web_findings && data.web_findings.length > 0) {
      if (data.answer) {
        const lead = document.createElement('p');
        lead.textContent = data.answer;
        answerBlock.appendChild(lead);
      }

      const list = document.createElement('div');
      list.className = 'web-findings';
      data.web_findings.forEach((finding) => {
        const item = document.createElement('div');
        item.className = 'web-finding';

        const content = document.createElement('div');
        content.className = 'web-finding-content';
        content.textContent = finding.content;
        item.appendChild(content);

        const meta = document.createElement('div');
        meta.className = 'web-finding-meta';
        // Never fabricate a date — only show one if the backend actually sent one.
        const label = finding.date
          ? `${finding.source} · ${finding.date}`
          : `${t('ask_source_prefix')} ${finding.source}`;
        if (finding.url) {
          const link = document.createElement('a');
          link.href = finding.url;
          link.target = '_blank';
          link.rel = 'noopener';
          link.textContent = label;
          meta.appendChild(link);
        } else {
          meta.textContent = label;
        }
        item.appendChild(meta);

        list.appendChild(item);
      });
      answerBlock.appendChild(list);
    } else {
      answerBlock.innerHTML = renderMarkdown(data.answer || '');
    }

    if (isWeb) {
      const note = document.createElement('div');
      note.className = 'expert-note';
      note.innerHTML = t('ask_note_web_html');
      div.appendChild(note);
    } else if (data.expert_note && data.expert_note.trim().length > 0) {
      // Only shown when the backend judged the retrieved context
      // genuinely relevant enough to support a summarized takeaway.
      const note = document.createElement('div');
      note.className = 'expert-note';
      note.innerHTML = `${t('ask_note_internal_prefix_html')}${data.expert_note}`;
      div.appendChild(note);
    }

    if (data.internal_analysis) {
      const block = document.createElement('div');
      block.className = 'internal-analysis-block';

      const label = document.createElement('div');
      label.className = 'internal-analysis-label';
      label.textContent = t('ask_internal_analysis_label');
      block.appendChild(label);

      const body = document.createElement('div');
      body.className = 'internal-analysis-body';
      body.innerHTML = renderMarkdown(data.internal_analysis);
      block.appendChild(body);

      div.appendChild(block);
    }

    // Prediction path (docs/TechSpec_v1.1.md §4.2): an approved prediction
    // gets its own clearly labeled block, visually distinct from a plain
    // retrieved answer — never just folded into answerBlock above, so a
    // reader can never mistake one for the other. A pending prediction
    // shows no draft content at all (never an unconfirmed one), only the
    // honest "pending" acknowledgment plus an optional fallback block.
    if (isPrediction && data.prediction_status === 'approved' && data.prediction_content) {
      const block = document.createElement('div');
      block.className = 'prediction-block';
      block.innerHTML = `
        <div class="prediction-label"></div>
        <div class="prediction-body"></div>
      `;
      block.querySelector('.prediction-label').textContent = t('ask_prediction_label');
      block.querySelector('.prediction-body').textContent = data.prediction_content;
      div.appendChild(block);
    } else if (isPrediction && data.prediction_status === 'pending' && data.prediction_fallback) {
      const block = document.createElement('div');
      block.className = 'prediction-pending-block';
      block.innerHTML = `
        <div class="prediction-pending-label"></div>
        <div class="prediction-pending-body"></div>
      `;
      block.querySelector('.prediction-pending-label').textContent = t('ask_prediction_pending_label');
      block.querySelector('.prediction-pending-body').innerHTML = renderMarkdown(data.prediction_fallback);
      div.appendChild(block);
    }

    if (data.chart_image) {
      const img = document.createElement('img');
      img.className = 'chart-img';
      img.src = `data:image/png;base64,${data.chart_image}`;
      div.appendChild(img);
    }

    threadInner.appendChild(div);
    scrollToBottom();
  }

  // Plain-text rendering used only for messages loaded from history (see
  // loadHistoryIntoView) — no source tag, no citation blocks, since none of
  // that metadata survives into the persisted checkpoint.
  function renderHistoricalAiMessage(content) {
    const div = document.createElement('div');
    div.className = 'msg msg-ai';
    div.innerHTML = `<div class="answer-block rag-border"></div>`;
    div.querySelector('.answer-block').innerHTML = renderMarkdown(content);
    threadInner.appendChild(div);
    scrollToBottom();
  }

  function renderError(message) {
    const div = document.createElement('div');
    div.className = 'msg msg-ai';
    div.innerHTML = `<div class="answer-block error-block"></div>`;
    div.querySelector('.error-block').textContent = message;
    threadInner.appendChild(div);
    scrollToBottom();
  }

  async function ask(question) {
    if (!question.trim()) return;

    sendBtn.disabled = true;
    renderUserMessage(question);
    renderThinking();

    try {
      const res = await authFetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          question: question,
          session_id: sessionId,
          language: getLanguage()
        })
      });

      if (!res.ok) throw new Error(`Server returned ${res.status}`);
      const data = await res.json();

      removeThinking();
      renderAiMessage(data);

      // First turn: the server just generated a session_id for us. Write it
      // into the URL so a refresh, bookmark, or copy-to-another-device
      // continues the same conversation.
      if (data.session_id && data.session_id !== sessionId) {
        sessionId = data.session_id;
        const url = new URL(window.location.href);
        url.searchParams.set('session_id', sessionId);
        history.replaceState(null, '', url);
      }
      loadThreadList();

    } catch (err) {
      removeThinking();
      renderError(`${t('ask_generic_error_prefix')} ${err.message}`);
    } finally {
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener('click', () => {
    const text = q.value;
    q.value = '';
    q.style.height = 'auto';
    ask(text);
  });

  q.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendBtn.click();
    }
  });

  q.addEventListener('input', () => {
    q.style.height = 'auto';
    q.style.height = Math.min(q.scrollHeight, 140) + 'px';
  });

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      ask(chip.dataset.q);
    });
  });

  // Initial load: restore this conversation's visible history if the URL
  // already names one (refresh, bookmark, or a link from another device),
  // and populate the sidebar either way.
  if (sessionId) {
    loadHistoryIntoView(sessionId);
  }
  loadThreadList();

  // Re-render whatever's language-dependent but not covered by static
  // data-i18n markup (thread list's empty/error state text).
  onLanguageChange(() => loadThreadList());
  initLanguageToggle();
</script>

</body>
</html>
